[build-system]
requires = ["setuptools>=69,<82", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "dispatch-center"
version = "0.1.0"
description = "Agent-native engineering platform: a governed AI engineering workspace with approval-gated execution"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "Authlib>=1.7,<2.0",
  "PyYAML>=6.0,<7.0",
  "asyncssh>=2.14,<3.0",
  "fastapi>=0.110,<1.0",
  "httpx>=0.27",
  "pydantic>=2.0,<3.0",
  "uvicorn[standard]>=0.27,<1.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.34,<1.0"]
mcp = ["mcp>=1.28,<2.0"]
test = [
  "anthropic>=0.34,<1.0",
  "httpx2>=2.9,<3.0",
  "mcp>=1.28,<2.0",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]
dev = [
  "build>=1.3,<2.0",
  "mypy>=1.17,<2.0",
  "pytest-cov>=6.2,<8.0",
  "ruff>=0.12,<1.0",
  "setuptools>=69,<82",
  "wheel>=0.45,<1.0",
]

[project.scripts]
dispatch = "dispatch_center.cli:main"
dispatch-api = "dispatch_center.cli:api"
dispatch-scheduler = "dispatch_center.cli:scheduler"
dispatch-worker = "dispatch_center.cli:worker"

[tool.setuptools]
packages = [
  "app",
  "app.settings",
  "dispatch_center",
  "dispatch_center.infrastructure",
  "dispatch_center.infrastructure.db",
  "dispatch_center.api",
  "dispatch_center.api.routers",
  "dispatch_center_web",
]
package-dir = {dispatch_center_web = "static"}

[tool.setuptools.package-data]
dispatch_center_web = ["*.html", "studio/*.html", "studio/assets/*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
faulthandler_timeout = 120
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["app", "agent", "dispatch_center"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Establish a measured baseline before raising this threshold. CI enforces the
# value, so it cannot silently regress while the monolith is decomposed.
fail_under = 35
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_any_generics = false
ignore_missing_imports = true
no_implicit_optional = false
pretty = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# Transparent legacy baseline. These modules had errors when the gate was
# introduced; every other existing module and every new module is checked.
# Remove entries as the router/settings/repository work makes each module
# clean. Do not add an entry merely to land new code.
module = [
  "app.agent_tools",
  "app.approvals",
  "app.authentication",
  "app.authorization",
  "app.authorization_shadow",
  "app.auto_placement",
  "app.autoapprove",
  "app.config",
  "app.dataset_snapshot",
  "app.datasets",
  "app.db",
  "app.engineering_path_policy",
  "app.engineering_tasks",
  "app.engineering_validation",
  "app.execution_backend",
  "app.execution_dispatch",
  "app.hub",
  "app.jobfinish",
  "app.jobqueue",
  "app.mailer",
  "app.main",
  "app.node_registry",
  "app.oidc",
  "app.scheduler",
  "app.server_config",
  "app.server_publication",
  "app.sshpool",
  "app.wp2d_canary",
]
ignore_errors = true

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".runtime", "results"]

[tool.ruff.lint]
# Start with correctness-oriented rules. Formatting adoption is intentionally
# separate so project hygiene does not obscure behavioral reviews.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"app/__init__.py" = ["F401"]
"agent/__init__.py" = ["F401"]
