name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# 整頓 C4 (DG-CONSOLIDATION-v1): five independent jobs instead of one
# 18-step sequence, so wall time ≈ the slowest job. The offline/temp-path
# environment is workflow-level so every job inherits the same posture
# (job-level `env` cannot expand the `runner` context, hence the literal
# /tmp paths — see tests/test_ci_release_gate.py).
env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  DISPATCH_TEST_NETWORK: deny
  ANTHROPIC_API_KEY: ""
  VLLM_BASE_URL: ""
  VLLM_MODEL: ""
  OIDC_ENABLED: "false"
  OIDC_ISSUER: ""
  OIDC_CLIENT_ID: ""
  OIDC_CLIENT_SECRET: ""
  DISPATCH_SERVICE_TOKEN: ""
  DB_PATH: /tmp/dispatch-center-tests/jobqueue.db
  AUDIT_PATH: /tmp/dispatch-center-tests/audit.jsonl
  SERVERS_YAML_PATH: /tmp/dispatch-center-tests/servers.yaml
  AUTO_APPROVE_RULES_PATH: /tmp/dispatch-center-tests/auto-approve.yaml
  LOCAL_HOME_DIR: /tmp/dispatch-center-tests

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - name: Install exact locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip check
      - name: Prepare isolated runtime paths
        run: mkdir -p "$LOCAL_HOME_DIR"
      - name: Verify direct requirements match the lock
        run: |
          python scripts/check_requirements_lock.py
          python scripts/check_requirements_lock.py \
            --manifest requirements-dev.txt \
            --lock requirements-dev.lock
      - name: Verify TestClient can enter and exit
        run: timeout 20s python scripts/testclient_smoke.py
      - name: Verify Node protocol primitives import
        run: python scripts/node_primitives_smoke.py
      - name: Collect the complete suite
        run: python -m pytest --collect-only -q
      - name: Run Ruff lint
        run: python -m ruff check app agent dispatch_center scripts tests
      - name: Run mypy type checks
        run: python -m mypy app agent dispatch_center scripts
      - name: Run static invariant checks
        run: bash .claude/skills/release-gate/scripts/static_checks.sh
      - name: Verify durable-audit adoption boundary
        run: python scripts/audit_adoption_gate.py
      - name: Verify the OpenAPI surface snapshot
        run: python scripts/openapi_snapshot.py --check

  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Build and test the Studio SPA
        run: |
          npm ci --prefix studio --no-audit --no-fund
          npm run build --prefix studio
          npm test --prefix studio
      - name: Publish the Studio build for packaging
        uses: actions/upload-artifact@v4
        with:
          name: studio-build-${{ github.sha }}
          path: static/studio
          if-no-files-found: error
          retention-days: 1

  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: studio
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - name: Install exact locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip check
      - name: Fetch the Studio build
        uses: actions/download-artifact@v4
        with:
          name: studio-build-${{ github.sha }}
          path: static/studio
      - name: Verify dependency-free frontend assets
        run: python scripts/frontend_smoke.py --require-studio
      - name: Build and smoke-test distributions
        run: |
          python -m build --no-isolation --outdir dist .
          python -m build --no-isolation --outdir dist agent
          python -m build --no-isolation --outdir dist dispatch_agent
          python scripts/check_wheel_boundaries.py dist
          python -m venv "$RUNNER_TEMP/package-smoke"
          "$RUNNER_TEMP/package-smoke/bin/python" -m pip install \
            --require-hashes -r requirements.lock
          "$RUNNER_TEMP/package-smoke/bin/python" -m pip install --no-deps \
            dist/dispatch_center-*.whl dist/dispatch_node_agent-*.whl
          "$RUNNER_TEMP/package-smoke/bin/python" -m pip check
          "$RUNNER_TEMP/package-smoke/bin/dispatch" --help
          "$RUNNER_TEMP/package-smoke/bin/dispatch-api" --help
          "$RUNNER_TEMP/package-smoke/bin/dispatch-worker" --help
          DISPATCH_CONTROL_PLANE_URL=http://127.0.0.1:8888 \
          DISPATCH_NODE_TOKEN=package-smoke-placeholder \
            DISPATCH_NODE_WORKDIR="$RUNNER_TEMP/node-agent-smoke" \
            "$RUNNER_TEMP/package-smoke/bin/dispatch-node-agent" --check
      - name: Publish review wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dispatch-wheels-${{ github.sha }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - name: Install exact locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip check
      - name: Prepare isolated runtime paths
        run: mkdir -p "$LOCAL_HOME_DIR"
      - name: Run complete suite once and report slow tests
        run: python -m pytest -q -n 4 --durations=25 --durations-min=0.5
      - name: Ensure tests did not pollute the checkout
        run: |
          git diff --exit-code
          git status --porcelain --untracked-files=all > "$RUNNER_TEMP/repo-status.txt"
          test ! -s "$RUNNER_TEMP/repo-status.txt"

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - name: Install exact locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip check
      - name: Prepare isolated runtime paths
        run: mkdir -p "$LOCAL_HOME_DIR"
      - name: Run core coverage gate
        run: python scripts/coverage_gate.py
