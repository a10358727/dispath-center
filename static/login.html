<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dispatch Center</title>
<style>
  :root { color-scheme: dark light; }
  html, body {
    margin: 0;
    height: 100%;
    background: #0f1115;
    color: #e6e6e6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .login-card {
    max-width: 360px;
    width: 90%;
    padding: 2.5rem 2rem;
    border-radius: 12px;
    background: #171a21;
    border: 1px solid #262b36;
    text-align: center;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    box-sizing: border-box;
  }
  .brand {
    font-size: 1.6rem;
    font-weight: 700;
    margin: 0 0 0.4rem;
  }
  .subtitle {
    font-size: 0.95rem;
    color: #9aa3b2;
    margin: 0 0 2rem;
  }
  .login-button {
    display: inline-block;
    width: 100%;
    padding: 0.85rem 1.2rem;
    border-radius: 8px;
    background: #3b82f6;
    color: #ffffff;
    text-decoration: none;
    font-size: 1.05rem;
    font-weight: 600;
    box-sizing: border-box;
  }
  .login-button:hover,
  .login-button:focus {
    background: #2563eb;
  }
  .note {
    margin-top: 1.5rem;
    font-size: 0.8rem;
    color: #6b7280;
  }
</style>
</head>
<body>
  <main class="login-card">
    <p class="brand">Dispatch Center</p>
    <p class="subtitle">Agent-native Engineering Platform</p>
    <a class="login-button" href="/auth/login">使用 OIDC 登入</a>
    <p class="note">登入後即進入完整工作空間</p>
  </main>
</body>
</html>
