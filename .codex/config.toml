# Main orchestrator: keep Astra lightweight and use specialized subagents
# for reasoning/research and implementation.
model = "gpt-6-astra"
model_reasoning_effort = "low"

[agents]
enabled = true
# Keep parallelism bounded: at most reasoning + research in parallel.
# Code-writing stays single-writer and happens after the problem is understood.
max_concurrent_threads_per_session = 2
interrupt_message = true

# Generic spawned workers default to the implementation profile budget.
# Explicit custom agent files below override this for reasoning/research.
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "high"
