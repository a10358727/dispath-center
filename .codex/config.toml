# Main orchestrator: cheap, capable routing/synthesis.
# Escalate difficult reasoning to sol_reasoner and implementation to luna_coder.
model = "gpt-6-luna"
model_reasoning_effort = "medium"

[agents]
enabled = true
# Allow independent reasoning + web research to run together, but keep code
# changes single-writer to avoid overlapping edits and integration churn.
max_concurrent_threads_per_session = 2
interrupt_message = true

# Generic child tasks (repo lookup, focused inspection, summaries) stay efficient.
# Approved implementation uses the explicit luna_coder profile at high effort.
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "medium"
