# Main integration/reasoning agent: flagship GPT-5.6 Sol.
model = "gpt-5.6-sol"
model_reasoning_effort = "xhigh"

[agents]
# Keep parallelism bounded to reduce conflicting edits and usage.
max_concurrent_threads_per_session = 2

# Generic spawned workers default to the cost-efficient model.
# Specialized agent files can override this (for example Terra explorer).
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "high"
